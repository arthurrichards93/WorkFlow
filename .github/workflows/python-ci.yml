
  coefficient-stability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow

      - name: Run coefficient stability experiments
        env:
          PYTHONPATH: src
        run: |
          python -m model_training.coefficient_stability

      - name: Upload MLflow tracking results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-stability-mlflow
          path: |
            mlruns/
            stability_outputs/
          if-no-files-found: warn
