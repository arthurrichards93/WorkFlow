
name: DM01 Coefficient Stability CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  coefficient-stability:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 - Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3 - Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow pytest

      # Step 4 - Run automated tests
      - name: Run automated tests
        env:
          PYTHONPATH: .:src
        run: |
          python -m pytest -v

      # Step 5 - Run coefficient stability experiments
      - name: Run coefficient stability experiments
        env:
          PYTHONPATH: .:src
          MLFLOW_TRACKING_URI: ./mlruns
        run: |
          python -m model_training.coefficient_stability

      # Step 6 - Upload MLflow results
      - name: Upload MLflow tracking results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-stability-results
          path: |
            mlruns/
            stability_outputs/
          if-no-files-found: warn
