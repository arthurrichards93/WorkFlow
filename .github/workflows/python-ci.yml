
name: DM01 Machine Learning CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  # JOB 1 - DATA VALIDATION
  validate-data:
    name: 1 - Validate DM01 Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CSV files
        run: python src/validate_data.py

  # JOB 2 - AUTOMATED TESTING
  run-tests:
    name: 2 - Run Automated Tests
    runs-on: ubuntu-latest
    needs: validate-data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

  # JOB 3 - MODEL TRAINING AND ARTIFACTS
  train-model:
    name: 3 - Train and Evaluate ML Model
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model and generate artifacts
        run: python src/train_model.py

      - name: Verify required artifacts
        run: |
          test -s artifacts/dm01_processed_data.csv
          test -s artifacts/model_results.csv
          test -s artifacts/dm01_model.joblib
          echo "All required artifacts generated successfully"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm01-processed-data
          path: artifacts/dm01_processed_data.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm01-model-evaluation
          path: artifacts/model_results.csv
          if-no-files-found: error
          retention-days: 30

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: dm01-trained-model
          path: artifacts/dm01_model.joblib
          if-no-files-found: error
          retention-days: 30
